name: Build debug APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Live transport check (real Cloudflare route)
        continue-on-error: true
        env:
          TGWS_LIVE: '1'
        run: ./gradlew :app:testDebugUnitTest --tests 'dev.minios.tgwsproxy.proxy.LiveCfTransportTest' --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/*.apk out/tgws-rf-debug.apk
          sha256sum out/tgws-rf-debug.apk | tee out/tgws-rf-debug.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: tgws-rf-debug-apk
          path: out/*
          if-no-files-found: error
